<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Finance · Tommy Tints HQ</title><style>body{background:#09090c;color:#fff;font:16px system-ui;margin:0;padding:20px}main{max-width:1050px;margin:auto}a{color:#ffda38}header{display:flex;align-items:center;gap:16px}header img{width:100px}button{padding:15px 22px;border-radius:10px;background:#da1429;color:white;border:0;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#19191e;border:1px solid #49424a;border-radius:16px;padding:18px}.value{font-size:30px;font-weight:800;margin:12px 0}.muted,small{color:#c9c5cb}progress{width:100%;accent-color:#ed2136;height:20px}#status{color:#ffda38}li{margin:12px 0}button:focus-visible,a:focus-visible{outline:3px solid #ffda38}</style><main><header><img src="/static/company-logo-header.webp" alt="Tommy Tints"><a href="/">Back to HQ</a></header><h1>Financial Command Centre</h1><p>Private owner view · spreadsheet figures, not verified live banking.</p><button id="refresh">Refresh finances</button> <a href="/auth/sheets/connect">Connect Google Sheets</a><p id="status" role="status">Loading…</p><p id="source" class="muted"></p><section id="cards" class="grid" aria-label="Financial figures"></section><h2>Planning comparison</h2><p>Forecast receipts versus commitments for the next 30 days. Expected receipts are not received income.</p><div id="comparison"></div><h2>Data limitations</h2><ul id="gaps"></ul></main><script>
let busy=false;
const money=p=>p===null?'Unavailable':new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(p/100);
async function refresh(){if(busy||document.hidden)return;busy=true;document.getElementById('refresh').disabled=true;const status=document.getElementById('status');status.textContent='Refreshing…';try{const r=await fetch('/api/hq/finance',{cache:'no-store',credentials:'same-origin'});if(!r.ok||r.redirected)throw Error('Finance unavailable. Check owner sign-in and the Google Sheets connection.');const d=await r.json();document.getElementById('cards').replaceChildren();for(const m of d.metrics){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.style.fontSize='16px';title.textContent=m.label;const value=document.createElement('p');value.className='value';value.textContent=money(m.pence);const note=document.createElement('small');note.textContent=m.basis+' · '+m.source+' · '+m.status;card.append(title,value,note);document.getElementById('cards').append(card)}status.textContent=(d.stale?'STALE / UNVERIFIED — ':'Spreadsheet refreshed — ')+d.bank_status+' · Bank data through '+(d.bank_data_date||'unknown')+' · Transactions needing review: '+d.review_count;document.getElementById('source').textContent=d.source+' · Last successful refresh '+new Date(d.refreshed_at).toLocaleString('en-GB');document.getElementById('gaps').replaceChildren();for(const gap of d.gaps){const li=document.createElement('li');li.textContent=gap;document.getElementById('gaps').append(li)}const box=document.getElementById('comparison');box.replaceChildren();const rows=d.metrics.filter(m=>['receipts','commitments'].includes(m.key));const max=Math.max(1,...rows.map(m=>m.pence||0));for(const m of rows){const label=document.createElement('p');label.textContent=m.label+' · '+money(m.pence);box.append(label);if(m.pence!==null){const bar=document.createElement('progress');bar.max=max;bar.value=Math.max(0,m.pence);bar.setAttribute('aria-label',label.textContent);box.append(bar)}}}catch(e){status.textContent=e.message;document.getElementById('cards').replaceChildren();document.getElementById('comparison').replaceChildren();document.getElementById('source').textContent='Refresh failed. Previous figures are hidden.'}finally{busy=false;document.getElementById('refresh').disabled=false}}
document.getElementById('refresh').addEventListener('click',refresh);document.addEventListener('visibilitychange',()=>{if(document.hidden){document.getElementById('cards').replaceChildren();document.getElementById('comparison').replaceChildren()}else refresh()});setInterval(refresh,300000);refresh();
</script></html>
