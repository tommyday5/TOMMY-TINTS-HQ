name: HQ tests
on:
  push:
    branches: [main, feature/service-profitability-engine]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q -x '/\.git/' .
      - name: Run integration and regression tests
        run: |
          python -m unittest discover -v
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi
      - name: Test app update detection
        run: node --test tests/hq-updates.test.cjs tests/hq-reactor.test.cjs tests/job-timer.test.cjs
